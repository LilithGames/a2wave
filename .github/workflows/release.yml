# a2wave Release — ported from the GitLab `release` job.
#
# Triggered by pushing a v<major>.<minor>.<patch> tag; extracts this version's
# section from CHANGELOG.md and creates a GitHub Release from it.

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk -v ver="## v${VERSION}" '
            BEGIN { in_section = 0 }
            $0 == ver { in_section = 1; next }
            /^## v/ && in_section { exit }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "⚠️  No '## v${VERSION}' section in CHANGELOG.md, using default notes"
            NOTES="Release ${TAG}"
          fi
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: a2wave ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
