# a2wave Release — ported from the GitLab `release` job.
#
# Triggered by pushing a v<major>.<minor>.<patch> tag, with or without a
# prerelease suffix; extracts this version's section from CHANGELOG.md and
# creates a GitHub Release from it.
#
# A prerelease tag is published as a GitHub *pre-release*, so it appears on the
# Releases page — an RC nobody can find is an RC nobody tests — while the
# `Latest` badge stays on the newest stable version. This is only about what
# GitHub advertises: docker.yml still refuses to move `:latest` and cli-publish
# still routes the npm dist-tag to `next` for these tags.

name: Release

on:
  push:
    tags:
      # Anchored shape, matching cli-publish.yml: a typo like `vfoo` must not
      # reach a release step at all.
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG.md
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="${TAG#v}"
          NOTES=$(awk -v ver="## v${VERSION}" '
            BEGIN { in_section = 0 }
            $0 == ver { in_section = 1; next }
            /^## v/ && in_section { exit }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "$NOTES" ]; then
            echo "⚠️  No '## v${VERSION}' section in CHANGELOG.md, using default notes"
            NOTES="Release ${TAG}"
          fi
          {
            echo 'notes<<EOF'
            echo "$NOTES"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"
          # A hyphen in the version is the semver prerelease marker — the same
          # test cli-publish.yml uses to pick the npm dist-tag, kept identical so
          # the two cannot disagree about what counts as a prerelease.
          case "$VERSION" in
            *-*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *)   echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: ${{ github.ref_name }}
          body: ${{ steps.notes.outputs.notes }}
          prerelease: ${{ steps.notes.outputs.prerelease }}
