# a2wave CI — orchestrated lanes behind a single aggregate gate.
#
# Shape (borrowed from hermes-agent's orchestrator + ollama's changes job):
# - `detect` classifies the diff once (scripts/ci/detect-changes.mjs); expensive
#   lanes are skipped when the diff cannot affect them. Cheap gates — lint,
#   typecheck, secret-scan — run unconditionally: they are the quality floor,
#   not lanes.
# - On push to main, detect runs `--all` (fail open): post-merge validation is
#   never weakened by lane skipping. A misclassified PR is caught one merge
#   later, not never.
# - `all-checks-pass` aggregates every job with `if: always()` — skipped counts
#   as success, failure/cancellation fails. Branch protection requires ONLY
#   this check, so adding or gating a lane never needs a protection edit (and a
#   new job can never silently land unprotected).
# - Lane skipping happens INSIDE the workflow, never via `on.paths`: a required
#   check on a workflow that does not trigger stays pending forever and blocks
#   the merge.
# - `labeled`/`unlabeled` retrigger the run so the review-labels gate re-reads
#   the PR's labels; the whole pipeline is ~2 minutes, so the re-run is cheap.
# - Playwright E2E is intentionally NOT in CI: it needs web+api running
#   together, and still runs locally via `pnpm test:all`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Least privilege: the gates only read the checkout. `actions: read` exists
# solely for the timing report step in all-checks-pass (it lists this run's
# jobs). Declared explicitly so the gates keep a minimal token even if the
# repository default is ever widened.
permissions:
  contents: read
  actions: read

# A new push supersedes the previous run of the same ref — PR iterations never
# queue behind their own stale runs. Pushes to main are never cancelled: every
# merge must get its full fail-open validation.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ───────────────────────────────────────────────────────────────────────
  # detect: classify the diff once; every skippable lane reads its outputs.
  # ───────────────────────────────────────────────────────────────────────
  detect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      api: ${{ steps.classify.outputs.api }}
      web: ${{ steps.classify.outputs.web }}
      cli: ${{ steps.classify.outputs.cli }}
      licenses: ${{ steps.classify.outputs.licenses }}
      pgschema: ${{ steps.classify.outputs.pgschema }}
      ci_review: ${{ steps.classify.outputs.ci_review }}
      ci_review_files: ${{ steps.classify.outputs.ci_review_files }}
    steps:
      # fetch-depth: 0 — the classifier diffs against the merge base, which a
      # shallow clone does not contain.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: classify
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            node scripts/ci/detect-changes.mjs \
              --base "${{ github.event.pull_request.base.sha }}" \
              --head "${{ github.event.pull_request.head.sha }}"
          else
            node scripts/ci/detect-changes.mjs --all
          fi

  # ───────────────────────────────────────────────────────────────────────
  # Always-on gates: the quality floor. Never gated on detect.
  # ───────────────────────────────────────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: node --test scripts/gates/__tests__/check-docker-context.test.mjs
      # Architecture rules R1–R8 ran only in the pre-commit hook before, but a
      # `--no-verify` push skips every hook and CLAUDE.md names CI as R6's
      # backstop — so the repo-wide sweeps must actually run here.
      - run: node scripts/gates/check-arch-rules.mjs --all
      - run: node scripts/gates/check-forbidden-tokens.mjs --all
      - run: node scripts/gates/check-file-lines.mjs --all
      # Workflow expressions have no type checking — a 178k-star repo ships a
      # concurrency group that evaluates to a constant and cancels across PRs.
      # Pinned + checksum-verified, like the gitleaks install below.
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" actionlint
          ./actionlint

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # The shared package exports dist/index.d.ts; api/web/cli need dist to
      # exist before `tsc --noEmit` can resolve @a2wave/shared.
      - uses: ./.github/actions/setup
        with:
          build-shared: 'true'
      - run: pnpm typecheck

  # Full-history secret scan. Must stay at zero findings: the allowlists in .gitleaks.toml are
  # scoped to specific placeholder strings, so anything reported here is genuinely new.
  # fetch-depth: 0 because a shallow clone would scan only the tip commit.
  #
  # Runs the gitleaks binary directly rather than gitleaks/gitleaks-action. The action requires a
  # GITLEAKS_LICENSE for organization-owned repos (free, but a manual request) and fails hard
  # without one; the scanner itself is MIT-licensed and needs no key. Invoking it directly also
  # keeps this job off the deprecated Node 20 action runtime.
  #
  # The release is pinned and checksum-verified, matching how scripts/provider-clis/install.mjs
  # fetches third-party binaries — an unpinned download would let a moved tag change what runs.
  # Bump VERSION and SHA256 together; the checksum comes from the release's tarball.
  # Hygiene gate: a PR description must report gate RESULTS, not pasted terminal
  # output. pnpm prints each package's absolute path before every script it runs,
  # so a pasted run log leaks the author's home directory (PR #28 carried 131
  # copies of it across ~3,800 lines) and buries the actual verdict.
  #
  # Uses the `pull_request` event's own payload rather than the API, so it keeps
  # the workflow's read-only token and never runs untrusted code from a fork.
  pr-description:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Via the environment, not an inline expression: a body containing shell
      # metacharacters must never be interpolated into the run script.
      - name: Check PR description hygiene
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" | node scripts/gates/check-pr-body.mjs -

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum --check --strict -
          tar -xzf "$archive" gitleaks
      # --redact so a genuine finding does not print the secret into public CI logs.
      # Exit code is the gate: 0 clean, 1 leaks found, 2 an error such as a malformed config.
      - name: Scan full history
        run: ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

  # Known-vulnerability floor for the dependency tree (the one check hermes,
  # vllm and dify all carry that we lacked). `high`: the tree is clean at
  # this level — the former high advisories (nanoid, brace-expansion) are
  # patched via range-scoped pnpm overrides in the root package.json. Do not
  # loosen the level to absorb a new advisory; patch or override it instead.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm audit --audit-level high

  # ───────────────────────────────────────────────────────────────────────
  # Lane-gated jobs: skipped when the diff cannot affect them.
  # ───────────────────────────────────────────────────────────────────────

  # Compliance gate: docs/dependency-license-inventory.md must still match the installed tree,
  # and no GPL/AGPL/LGPL/SSPL or unknown-licensed dependency may enter it. Gated on the
  # licenses lane (a package.json or lockfile change) — a source-only diff cannot
  # change the dependency tree.
  license-inventory:
    needs: detect
    if: needs.detect.outputs.licenses == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm licenses:check

  # Web unit tests. Shared is a dependency, so shared changes turn this lane on.
  test-web:
    needs: detect
    if: needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-shared: 'true'
      - run: pnpm --filter @a2wave/shared test
      - run: pnpm --filter @a2wave/web test

  # CLI + scripts/ tests. The scripts/ node --test groups are part of the root
  # `pnpm test`; running per-package here would silently drop them, so they are
  # listed explicitly (same reasoning as the old combined test job).
  test-cli:
    needs: detect
    if: needs.detect.outputs.cli == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # scripts/deploy tests re-run the remote docker commands under dash to prove
      # they don't rely on bash extensions and parse correctly under POSIX sh.
      - name: Install dash
        run: sudo apt-get update && sudo apt-get install -y dash
      - uses: ./.github/actions/setup
        with:
          build-shared: 'true'
      - run: pnpm --filter @a2wave/shared test
      - run: pnpm --filter a2wave test
      - run: pnpm provider-clis:test
      - run: node --test scripts/deploy/__tests__/deploy-remote.test.mjs
      # The api gate's own regression tests — they guard the "a suite that fails to
      # load reports zero failing assertions" hole, which is invisible to the gate
      # it protects. Cheap (synthetic reports, no real suite run), so they live in
      # this fast lane rather than behind the api build toolchain.
      - run: node --test scripts/gates/__tests__/check-api-tests.test.mjs
      # The lane classifier's own tests: a wrong lane mapping is a suite that
      # silently never runs, so the classifier is under the same regression
      # protection as the gates.
      - run: node --test scripts/ci/__tests__/detect-changes.test.mjs
      - run: node --test scripts/ci/__tests__/merge-latency.test.mjs
      # Pure helpers of the minVersion verifier. The verifier itself installs real
      # CLIs from npm and is deliberately NOT run here; these tests inject the
      # exec boundary, so they neither hit the network nor spawn a CLI.
      - run: node --test scripts/__tests__/verify-provider-min-versions.test.mjs
      # AUTH_SECRET generation for `pnpm dev` and for the container entrypoint. Both are
      # first-run onboarding paths, so a regression here breaks the documented quickstart
      # rather than a feature — exactly the failure nobody notices until a new user hits it.
      - run: node --test scripts/__tests__/ensure-auth-secret.test.mjs
      - run: node --test scripts/__tests__/container-auth-secret.test.mjs
      # Pure helpers of the license-inventory gate (rendering, drift diffing, forbidden-license
      # detection). No pnpm store access — the store-dependent half runs in `license-inventory`.
      - run: node --test scripts/gates/__tests__/check-license-inventory.test.mjs
      # Guards .gitleaks.toml against the silent failure where an allowlist loses its
      # `condition = "AND"` and starts suppressing an entire file instead of one placeholder.
      # Pure text assertions — no gitleaks binary needed, unlike the `secret-scan` job.
      - run: node --test scripts/gates/__tests__/gitleaks-config.test.mjs

  # apps/api unit tests — blocking, split into 4 parallel shards (the whole-suite
  # run is the pipeline's critical path). Each shard goes through
  # scripts/gates/check-api-tests.mjs, which compares failures against baselines:
  # only failures NOT in the baseline turn the pipeline red, a shard that fails
  # to LOAD a file is always red, and the collection floor scales per shard.
  # Baseline entries shrink, never grow.
  #
  # NOTE: this job must NOT use --ignore-scripts. The api tests hit a real SQLite,
  # and better-sqlite3 may need to build its native addon from source via node-gyp
  # when no prebuilt binary matches — which needs python3 + a C++ toolchain
  # (preinstalled on ubuntu runners). Skipping install scripts would make every
  # test fail with "native addon is missing" — an environment problem, not a
  # regression signal.
  test-api:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          install-scripts: 'true'
          build-shared: 'true'
      - run: node scripts/gates/check-api-tests.mjs --shard=${{ matrix.shard }}/4

  # Generated-file freshness (the ollama `go mod tidy --diff` pattern):
  # schema.pg.ts is generated from the SQLite schema and never hand-edited —
  # this lane is what makes that a CI fact instead of a docs promise.
  pgschema:
    needs: detect
    if: needs.detect.outputs.pgschema == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          build-shared: 'true'
      - run: pnpm --filter @a2wave/api db:generate:pg
      - name: schema.pg.ts must regenerate clean
        run: |
          git diff --exit-code -- apps/api/src/db/schema.pg.ts || {
            echo "::error::schema.pg.ts is stale or hand-edited. Run 'pnpm --filter @a2wave/api db:generate:pg' and commit the result."
            exit 1
          }

  # ───────────────────────────────────────────────────────────────────────
  # review-labels: pipeline-touching paths need a human sign-off.
  #
  # The trust model gives every invited colleague merge-on-green; this gate is
  # the counterweight — the CI definition, gate scripts, waiver lists, the
  # pinned CLI lock, test configuration and DB migrations cannot change
  # without a second person adding the `ci-reviewed` label. Adding the label
  # retriggers this run (`labeled` is in the trigger list).
  # ───────────────────────────────────────────────────────────────────────
  review-labels:
    needs: detect
    if: github.event_name == 'pull_request' && needs.detect.outputs.ci_review == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci-reviewed') }}
      REVIEW_FILES: ${{ needs.detect.outputs.ci_review_files }}
    steps:
      - name: Require the ci-reviewed label
        run: |
          if [ "$HAS_LABEL" = "true" ]; then
            echo "ci-reviewed label present — sign-off recorded."
            exit 0
          fi
          echo "::error::This PR touches CI-sensitive paths and needs a maintainer to add the 'ci-reviewed' label."
          echo "Files requiring sign-off:"
          echo "$REVIEW_FILES" | tr ',' '\n' | sed 's/^/  - /'
          exit 1

  # ───────────────────────────────────────────────────────────────────────
  # Gate: aggregates every job. `if: always()` ensures it reports even when
  # deps were skipped; only failure/cancellation fails it.
  #
  # Branch protection must require ONLY this check.
  # ───────────────────────────────────────────────────────────────────────
  all-checks-pass:
    name: all-checks-pass
    needs:
      - detect
      - lint
      - typecheck
      - secret-scan
      - audit
      - license-inventory
      - test-web
      - test-cli
      - test-api
      - pgschema
      - scm-storage-integration
      - review-labels
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Evaluate job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          # shellcheck disable=SC2016  # the ${} below are JS template literals inside a single-quoted node -e script, not shell expansions
          node -e '
            const needs = JSON.parse(process.env.NEEDS)
            const bad = []
            for (const [name, info] of Object.entries(needs).sort()) {
              const ok = info.result === "success" || info.result === "skipped"
              console.log(`${ok ? "✅" : "❌"} ${name}: ${info.result}`)
              if (!ok) bad.push(name)
            }
            if (bad.length) {
              console.error(`::error::${bad.length} job(s) did not pass: ${bad.join(", ")}`)
              process.exit(1)
            }
            console.log("All checks passed (or were skipped)")
          '
      # Lightweight timing report: per-job durations into the run summary, so a
      # slowing pipeline is visible on every run instead of discovered by feel.
      # Advisory only — an API blip must not fail the gate.
      - name: CI timing summary
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## CI timings"
            echo ""
            echo "| Job | Duration | Result |"
            echo "|---|---|---|"
            gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion != null) | [.name, (((.completed_at | fromdate) - (.started_at | fromdate)) | tostring + "s"), .conclusion] | "| \(.[0]) | \(.[1]) | \(.[2]) |"'
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────────────────────────────────────────────────────
  # scm-storage: cross-boundary gate. Unit mocks cannot prove transaction-lock
  # behavior across real drivers, nor Linux bind-mount ownership semantics.
  # Gated on the api lane because every SCM storage path lives under apps/api.
  # ───────────────────────────────────────────────────────────────────────
  scm-storage-integration:
    needs: detect
    if: needs.detect.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: a2wave
          POSTGRES_PASSWORD: a2wave
          POSTGRES_DB: a2wave_scm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a2wave -d a2wave_scm_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      SCM_STORAGE_POSTGRES_URL: postgres://a2wave:a2wave@127.0.0.1:5432/a2wave_scm_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # Install explicitly, WITHOUT --ignore-scripts: this suite opens a real
      # SQLite database, so better-sqlite3 must build its native addon. A setup
      # path that skips install scripts fails every case on a missing addon
      # rather than on anything this gate is meant to catch.
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @a2wave/shared build
      - uses: docker/setup-buildx-action@v4
      # Build here rather than inside the script so the layers can be cached
      # between runs. A fresh runner has no layer cache, so every run was
      # re-downloading the pinned p4 binary from the Perforce CDN — 20MB of
      # third-party availability standing between this gate and a verdict about
      # our own storage code. `--load` puts the image in the local daemon, which
      # is where the script's ownership matrix looks for it.
      - name: Build the image (cached)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: a2wave:scm-storage-test
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: pnpm test:scm-storage
        env:
          # Already built above, with cache.
          SCM_STORAGE_BUILD_IMAGE: 'false'
